    SplitBill:
      type: object
      required: [id, user_id, title, total_amount, currency, date, participants, created_at, updated_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        entry_id:
          type: [integer, "null"]
        group_id:
