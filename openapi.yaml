
openapi: 3.1.0
info:
  title: FINNRI MVP API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/dashboard:
    get:
      summary: Return the deterministic spending dashboard for a date range
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: tz
          schema:
            type: string
            default: Asia/Kolkata
      responses:
        "200":
          description: Dashboard calculated from owned transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "422":
          description: Invalid or oversized date range
  /v1/insights:
    get:
      deprecated: true
      summary: Compatibility alias for GET /v1/dashboard
      responses:
        "200":
          description: Dashboard calculated from owned transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /v1/recurring-candidates/decision:
    post:
      summary: Persist a review decision for a detected recurring candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringCandidateDecisionInput"
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringCandidateDecision"
        "422":
          description: Invalid decision fields
  /v1/user:
    delete:
      summary: Permanently delete the authenticated user and owned data
      responses:
        "200":
          description: User and owned data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "401":
          description: Missing or invalid session
        "404":
          description: User not found
        "500":
          description: Delete failed
  /v1/parse:
    post:
      summary: Parse audio/text to structured expense/income JSON
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                hint_text:
                  type: string
                tz:
                  type: string
                  default: Asia/Kolkata
      responses:
        "200":
          description: Parsed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseOrIncomeEntry"
        "422":
          description: Could not parse
  /v1/entries:
    post:
      summary: Create a transaction entry
      parameters:
        - in: header
          name: Idempotency-Key
          description: Reuse the same key when retrying one logical create request.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "400":
          description: Invalid payload
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Database error
    get:
      summary: List all transaction entries
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: sort
          description: >-
            Result order. Amount sorts rank across the whole filtered set, so a
            client that groups rows by day has to stop doing so to render them.
          schema:
            type: string
            enum: [newest, oldest, highest, lowest]
            default: newest
        - in: query
          name: uncategorised
          description: >-
            Return only entries with no category at all. Misc is excluded — it is
            a real category the parser and the entry form both file things under
            deliberately, not an empty one.
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "422":
          description: Invalid filters
        "500":
          description: Database error
  /v1/entries/export:
    get:
      summary: Export filtered transaction entries as CSV
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
            default: csv
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV export containing owned entries that match filters
          content:
            text/csv:
              schema:
                type: string
        "422":
          description: Invalid filters, unsupported format, or export row limit exceeded
        "500":
          description: Export failed
  /v1/merchants/suggestions:
    get:
      summary: Suggest merchants from the authenticated user's entry history
      parameters:
        - in: query
          name: q
          description: Optional case-insensitive merchant substring to match.
          schema:
            type: string
            maxLength: 120
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        "200":
          description: Merchant autocomplete suggestions derived from owned entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantSuggestions"
        "422":
          description: Invalid query or limit
        "500":
          description: Suggestions failed
  /v1/reports/transactions/summary:
    get:
      summary: Return filtered transaction report rollups
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary and read-only rollups for owned entries matching filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionReport"
        "422":
          description: Invalid filters
        "500":
          description: Report failed
  /v1/accounts:
    get:
      summary: List accounts owned by the authenticated user, with figures derived from their transactions
      parameters:
        - in: query
          name: tz
          required: false
          schema:
            type: string
          description: IANA zone deciding which calendar month "this month" is. Defaults to the server's TZ_DEFAULT.
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountWithSummary"
        "500":
          description: Account activity could not be loaded
    post:
      summary: Create an account/payment source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /v1/accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned account or make it the default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "422":
          description: Invalid account fields
        "404":
          description: Account not found
    delete:
      summary: Delete an unused owned account
      responses:
        "200":
          description: Deleted
        "409":
          description: Account is used by transactions or is the user's only account
        "404":
          description: Account not found
  /v1/entries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get an owned transaction
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "404":
          description: Not found
    put:
      summary: Update an owned transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntry"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    delete:
      summary: Delete an owned transaction
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /v1/upload:
    post:
      summary: Upload a receipt and get the URL to persist on an entry
      description: >
        Accepts a single JPEG, PNG, HEIC, WebP or PDF file. The stored type is
        determined by sniffing the file's leading bytes; the client-supplied
        filename and Content-Type are ignored. The file is saved under a random
        name and served from an unauthenticated static route, so the returned
        URL is effectively a capability - treat it as secret.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    example: https://api.finnri.com/uploads/9f8c1d2e3a4b5c6d7e8f90a1b2c3d4e5.jpg
        "400":
          description: No file provided
        "413":
          description: File exceeds MAX_UPLOAD_MB
        "415":
          description: File type is not an accepted image or PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
  /v1/notifications:
    get:
      summary: List notifications for the authenticated user
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "422":
          description: Invalid filters
  /v1/notifications/unread-count:
    get:
      summary: Return the authenticated user's unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
  /v1/notifications/read-all:
    patch:
      summary: Mark all notifications read for the authenticated user
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
  /v1/notifications/{id}/read:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    patch:
      summary: Mark one owned notification read
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
  /v1/notifications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    delete:
      summary: Delete one owned notification
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /v1/budgets:
    get:
      summary: List monthly budgets owned by the authenticated user
      responses:
        "200":
          description: Budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      summary: Create a monthly INR budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Budget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "422":
          description: Invalid budget fields
  /v1/budgets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned monthly budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "404":
          description: Budget not found
        "422":
          description: Invalid budget fields
    delete:
      summary: Delete an owned budget and its alert state
      responses:
        "200":
          description: Deleted
        "404":
          description: Budget not found
  /v1/subscriptions:
    get:
      summary: List subscriptions owned by the authenticated user
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, active, paused, cancelled]
            default: all
      responses:
        "200":
          description: Subscriptions with due-state metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        "422":
          description: Invalid filters
    post:
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "422":
          description: Invalid subscription fields or account ownership
  /v1/subscriptions/reminders:
    post:
      summary: Create deduplicated due/overdue subscription reminders
      responses:
        "200":
          description: Reminder count
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: integer
  /v1/subscriptions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: Subscription not found
        "422":
          description: Invalid subscription fields or account ownership
    delete:
      summary: Delete an owned subscription and reminder state
      responses:
        "200":
          description: Deleted
        "404":
          description: Subscription not found
  /v1/subscriptions/{id}/mark-paid:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Mark a subscription paid and advance its next due date
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: Subscription not found
        "422":
          description: Invalid paid date
  /v1/split/friends:
    post:
      summary: Create a bill-splitting friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitFriendInput"
      responses:
        "201":
          description: Friend created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitFriend"
        "422":
          description: Invalid friend payload
    get:
      summary: List bill-splitting friends
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, all]
      responses:
        "200":
          description: Friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitFriend"
  /v1/split/friends/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update a bill-splitting friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitFriendInput"
      responses:
        "200":
          description: Friend updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitFriend"
        "404":
          description: Friend not found
    delete:
      summary: Archive a bill-splitting friend
      responses:
        "200":
          description: Friend archived
        "404":
          description: Friend not found
  /v1/split/groups:
    post:
      summary: Create a bill-splitting group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitGroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitGroup"
        "422":
          description: Invalid group payload
    get:
      summary: List bill-splitting groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitGroup"
  /v1/split/groups/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update a bill-splitting group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitGroupInput"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitGroup"
        "404":
          description: Group not found
    delete:
      summary: Archive a bill-splitting group
      responses:
        "200":
          description: Group archived
        "404":
          description: Group not found
  /v1/split/bills:
    post:
      summary: Create a split bill with friend shares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitBillInput"
      responses:
        "201":
          description: Split bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitBill"
        "422":
          description: Invalid bill payload or friend ownership
    get:
      summary: List split bills
      responses:
        "200":
          description: Split bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitBill"
  /v1/split/bills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a split bill with friend shares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitBillInput"
      responses:
        "200":
          description: Split bill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitBill"
        "404":
          description: Split bill not found
        "422":
          description: Invalid bill payload or ownership
    delete:
      summary: Delete a split bill
      responses:
        "200":
          description: Split bill deleted
        "404":
          description: Split bill not found
  /v1/split/settlements:
    post:
      summary: Record a split settlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitSettlementInput"
      responses:
        "201":
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitSettlement"
        "422":
          description: Invalid settlement payload or friend ownership
    get:
      summary: List split settlements
      responses:
        "200":
          description: Split settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitSettlement"
  /v1/split/balances:
    get:
      summary: Return friend balances after bills and settlements
      responses:
        "200":
          description: Friend balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitBalance"
  /v1/tools/emi/calculate:
    post:
      summary: Calculate EMI summary and amortization schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EMICalculationInput"
      responses:
        "200":
          description: EMI calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EMICalculation"
        "422":
          description: Invalid EMI fields
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    TransactionReport:
      type: object
      required: [summary, by_category, by_merchant, by_account, by_month, by_type]
      properties:
        summary:
          type: object
          required: [total_expense, total_income, net_cashflow, transaction_count, expense_count, income_count]
          properties:
            total_expense:
              type: number
            total_income:
              type: number
            net_cashflow:
              type: number
            transaction_count:
              type: integer
            expense_count:
              type: integer
            income_count:
              type: integer
        by_category:
          type: array
          items:
            $ref: "#/components/schemas/TransactionReportBreakdown"
        by_merchant:
          type: array
          items:
            $ref: "#/components/schemas/TransactionReportBreakdown"
        by_account:
          type: array
          items:
            $ref: "#/components/schemas/TransactionAccountReportBreakdown"
        by_month:
          type: array
          items:
            $ref: "#/components/schemas/TransactionMonthlyReportBreakdown"
        by_type:
          type: array
          items:
            $ref: "#/components/schemas/TransactionTypeReportBreakdown"
    TransactionReportBreakdown:
      type: object
      required: [key, label, amount, percentage, transaction_count]
      properties:
        key:
          type: string
        label:
          type: string
        amount:
          type: number
        percentage:
          type: number
        transaction_count:
          type: integer
    TransactionAccountReportBreakdown:
      type: object
      required: [account_name, amount, percentage, transaction_count]
      properties:
        account_id:
          type: [integer, "null"]
        account_name:
          type: string
        amount:
          type: number
        percentage:
          type: number
        transaction_count:
          type: integer
    TransactionMonthlyReportBreakdown:
      type: object
      required: [month, expense, income, net_cashflow, transaction_count]
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        expense:
          type: number
        income:
          type: number
        net_cashflow:
          type: number
        transaction_count:
          type: integer
    TransactionTypeReportBreakdown:
      type: object
      required: [type, amount, transaction_count]
      properties:
        type:
          type: string
          enum: [expense, income]
        amount:
          type: number
        transaction_count:
          type: integer
    Dashboard:
      type: object
      required: [period, summary, top_categories, top_merchants, account_spending, budget_statuses, daily_spending, recent_transactions, review_items, insights, recurring_candidates]
      properties:
        period:
          type: object
          required: [start, end, previous_start, previous_end, comparison_kind, comparison_label]
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
            previous_start:
              type: string
              format: date
              description: Start of the window every change on this response is measured against.
            previous_end:
              type: string
              format: date
            comparison_kind:
              type: string
              enum: [same_days_previous_month, preceding_period]
              description: >-
                How the previous window was chosen. A range starting on the 1st and ending inside
                the same month compares against the same days of the previous month; any other
                range compares against the equal-length window immediately before it.
            comparison_label:
              type: string
              description: The comparison stated for display, e.g. "Aug 1-11 vs Jul 1-11".
        summary:
          type: object
          required:
            [
              total_spent,
              total_income,
              daily_average,
              transaction_count,
              previous_total_spent,
              spend_change,
              spend_change_comparable,
            ]
          properties:
            total_spent:
              type: number
            total_income:
              type: number
            daily_average:
              type: number
            transaction_count:
              type: integer
            previous_total_spent:
              type: number
              description: Expense total for the window named by period.previous_start/previous_end.
            spend_change:
              type: number
              description: >-
                Percent change in total spend against the previous window. Always 0 when
                spend_change_comparable is false — read that flag first, never this value alone.
            spend_change_comparable:
              type: boolean
              description: >-
                False when the previous window was too thin to divide by (under ₹500 or fewer
                than 5 transactions). Show no comparison at all rather than a percentage that
                describes a near-empty base.
        top_categories:
          type: array
          description: >-
            The complete expense breakdown for the window, highest amount first — despite the
            name, not just the top few. Capped at 25 entries so the payload stays bounded for a
            user with many custom categories; whatever falls outside the list is still counted in
            summary.total_spent, which is what an "Other" rollup is derived from.
          items:
            $ref: "#/components/schemas/DashboardCategory"
        top_merchants:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMerchant"
        account_spending:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAccount"
        budget_statuses:
          type: array
          items:
            $ref: "#/components/schemas/DashboardBudgetStatus"
        daily_spending:
          type: array
          items:
            $ref: "#/components/schemas/DashboardDailySpend"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/SavedEntry"
        review_items:
          type: array
          items:
            $ref: "#/components/schemas/DashboardReviewItem"
        insights:
          type: array
          items:
            $ref: "#/components/schemas/InsightCard"
        recurring_candidates:
          type: array
          items:
            $ref: "#/components/schemas/DashboardRecurringCandidate"
    DashboardCategory:
      type: object
      required: [category, amount, percentage, change, change_comparable]
      properties:
        category:
          type: string
        amount:
          type: number
        percentage:
          type: number
        change:
          type: number
          description: >-
            Percentage change against the previous window. Always 0 when change_comparable is
            false, so clients that only read this field show no trend rather than a false one.
        change_comparable:
          type: boolean
          description: >-
            False when the previous window held less than the floor needed to divide by
            (at least 500 rupees and at least 5 transactions in that category).
    DashboardMerchant:
      type: object
      required: [merchant, amount, transaction_count]
      properties:
        merchant:
          type: string
        amount:
          type: number
        transaction_count:
          type: integer
    DashboardDailySpend:
      type: object
      required: [date, amount, count]
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
        count:
          type: integer
    DashboardReviewItem:
      allOf:
        - $ref: "#/components/schemas/SavedEntry"
        - type: object
          required: [category_suggestions]
          properties:
            category_suggestions:
              type: array
              items:
                type: string
    DashboardAccount:
      type: object
      required: [account_name, amount, percentage]
      properties:
        account_id:
          type: [integer, "null"]
        account_name:
          type: string
        amount:
          type: number
        percentage:
          type: number
    DashboardBudgetStatus:
      type: object
      required: [budget_id, name, category, limit_amount, spent_amount, remaining_amount, percentage, alert_threshold_percent, days_left, status]
      properties:
        budget_id:
          type: integer
        name:
          type: string
        category:
          type: string
        limit_amount:
          type: number
        spent_amount:
          type: number
        remaining_amount:
          type: number
        percentage:
          type: number
        alert_threshold_percent:
          type: integer
        days_left:
          type: integer
        status:
          type: string
          enum: [safe, watch, exceeded]
    DashboardRecurringCandidate:
      type: object
      required: [candidate_key, label, merchant, category, average_amount, interval_guess, confidence, occurrences, last_seen_date, next_expected_date, review_due]
      properties:
        candidate_key:
          type: string
        label:
          type: string
        merchant:
          type: string
        category:
          type: string
        average_amount:
          type: number
        interval_guess:
          type: string
          enum: [weekly, monthly]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        occurrences:
          type: integer
        last_seen_date:
          type: string
          format: date
        next_expected_date:
          type: string
          format: date
        review_due:
          type: boolean
    RecurringCandidateDecisionInput:
      type: object
      required: [decision]
      properties:
        candidate_key:
          type: string
        merchant:
          type: string
        category:
          type: string
        decision:
          type: string
          enum: [dismissed, snoozed, tracked]
        snoozed_until:
          type: string
          format: date
    RecurringCandidateDecision:
      allOf:
        - $ref: "#/components/schemas/RecurringCandidateDecisionInput"
        - type: object
          required: [id, user_id, candidate_key, merchant, category, decision, last_reviewed_at, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            last_reviewed_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    InsightCard:
      type: object
      required: [kind, severity, title, body]
      properties:
        kind:
          type: string
          enum: [period_comparison, category_increase, top_merchant, account_usage, unusual_spending, recurring_candidate, budget_watch, budget_exceeded]
        severity:
          type: string
          enum: [info, warning, success]
        title:
          type: string
        body:
          type: string
        explanation:
          type: string
        action_label:
          type: string
        category:
          type: string
        merchant:
          type: string
        budget_id:
          type: integer
        account_id:
          type: integer
          nullable: true
        account_name:
          type: string
        amount:
          type: number
        limit_amount:
          type: number
        remaining_amount:
          type: number
        status:
          type: string
        percentage:
          type: number
        change_percentage:
          type: number
        transaction_count:
          type: integer
        next_expected_date:
          type: string
          format: date
        confidence:
          type: number
          minimum: 0
          maximum: 1
    ExpenseOrIncomeEntry:
      $ref: ./schemas/expense_entry.schema.json
    FinalEntry:
      $ref: ./schemas/final_entry.schema.json
    UpdateEntry:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [expense, income]
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
        source:
          type: string
          enum: [manual, text, voice]
        account_id:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [Cash, Bank Account, UPI, Credit Card, Wallets]
        category:
          type: string
        merchant:
          type: string
        notes:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        tag:
          type: string
        split:
          description: Omit to leave the linked split unchanged, send null to remove it, or send an object to replace it atomically with the entry update.
          oneOf:
            - $ref: "#/components/schemas/EntryLinkedSplitInput"
            - type: "null"
    EntryLinkedSplitInput:
      type: object
      required: [participants]
      additionalProperties: false
      properties:
        group_id:
          type: [integer, "null"]
          minimum: 1
        group_name:
          type: string
        notes:
          type: string
        participants:
          type: array
          minItems: 1
          items:
            type: object
            required: [share_amount]
            additionalProperties: false
            properties:
              friend_id:
                type: integer
                minimum: 1
              friend:
                type: object
                required: [name]
                additionalProperties: false
                properties:
                  name:
                    type: string
                  email:
                    type: string
                  phone:
                    type: string
              share_amount:
                oneOf:
                  - type: number
                    exclusiveMinimum: 0
                    multipleOf: 0.01
                  - type: string
                    pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
              direction:
                type: string
                enum: [friend_owes_user, user_owes_friend]
    SavedEntry:
      allOf:
        - $ref: "#/components/schemas/FinalEntry"
        - type: object
          properties:
            id:
              type: integer
            account:
              $ref: "#/components/schemas/Account"
            source:
              type: string
              enum: [manual, text, voice]
            source_text:
              type: string
    EntryPage:
      type: object
      required: [entries, page, page_size, total, total_pages]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SavedEntry"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
        category_counts:
          type: object
          description: >-
            Entries per category across the whole filtered set, counted with the
            category filter itself omitted — each value answers "how many would I
            get if I picked this one". Legacy names are folded onto their
            canonical category. Absent categories are absent, not zero.
          additionalProperties:
            type: integer
    MerchantSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/MerchantSuggestion"
    MerchantSuggestion:
      type: object
      required: [merchant, category, transaction_count, last_seen_date]
      properties:
        merchant:
          type: string
        category:
          type: string
        transaction_count:
          type: integer
        last_seen_date:
          type: string
          format: date
    AccountInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        provider:
          type: string
        identifier:
          type: string
        credit_limit:
          type: number
          multipleOf: 0.01
          minimum: 0
        due_day:
          type: integer
          minimum: 0
          maximum: 31
        fee_month:
          type: string
        balance:
          type: number
          multipleOf: 0.01
        is_default:
          type: boolean
    Account:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        provider:
          type: string
        identifier:
          type: string
        credit_limit:
          type: number
          multipleOf: 0.01
        due_day:
          type: integer
        fee_month:
          type: string
        balance:
          type: number
          multipleOf: 0.01
          description: >-
            Opening balance — what the account held, or on a card owed, before the
            first logged transaction. Never a current figure on its own.
        is_default:
          type: boolean
    AccountWithSummary:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [summary]
          properties:
            summary:
              $ref: "#/components/schemas/AccountSummary"
    AccountSummary:
      type: object
      description: >-
        Figures derived from the account's entries. Nothing here is user-entered.
        Month-to-date runs from the 1st to today, matching the dashboard's default
        range so the two screens cannot disagree about the same account.
      required:
        [
          spent_this_month,
          received_this_month,
          entries_this_month,
          lifetime_spent,
          lifetime_received,
          entries_total,
        ]
      properties:
        spent_this_month:
          type: number
        received_this_month:
          type: number
        entries_this_month:
          type: integer
        lifetime_spent:
          type: number
        lifetime_received:
          type: number
        entries_total:
          type: integer
        last_activity_date:
          type: string
          format: date
          description: Most recent entry date. Absent when the account has never been used.
        outstanding:
          type: number
          description: >-
            Credit cards only — opening balance plus lifetime spend minus payments
            and refunds. This, never credit_limit, is what a card row shows as money.
        credit_utilisation:
          type: number
          description: >-
            Credit cards with a limit only. Percentage of the limit in use; may
            exceed 100 when the card is over its limit, and is 0 for a card in credit.
        running_balance:
          type: number
          description: >-
            Non-card accounts with an opening balance only — opening plus money in
            minus money out. Absent otherwise, because net flow is not a balance.
    BudgetInput:
      type: object
      required: [name, limit_amount]
      properties:
        name:
          type: string
          maxLength: 120
        period:
          type: string
          enum: [monthly]
          default: monthly
        category:
          type: string
          description: Empty means all expense categories.
          maxLength: 80
        limit_amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
          default: INR
        alert_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          default: 80
        active:
          type: boolean
          default: true
    Budget:
      allOf:
        - $ref: "#/components/schemas/BudgetInput"
        - type: object
          required: [id, user_id, name, period, category, limit_amount, currency, alert_threshold_percent, active, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SubscriptionInput:
      type: object
      required: [name, amount, next_due_date]
      properties:
        account_id:
          type: [integer, "null"]
          minimum: 1
        name:
          type: string
          maxLength: 120
        merchant:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 80
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
          default: INR
        billing_interval:
          type: string
          enum: [weekly, monthly, yearly]
          default: monthly
        next_due_date:
          type: string
          format: date
        last_charged_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, paused, cancelled]
          default: active
        reminder_days:
          type: integer
          minimum: 0
          maximum: 30
          default: 3
        notes:
          type: string
    Subscription:
      allOf:
        - $ref: "#/components/schemas/SubscriptionInput"
        - type: object
          required: [id, user_id, name, amount, currency, billing_interval, next_due_date, status, reminder_days, days_until_due, due_state, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            account:
              $ref: "#/components/schemas/Account"
            days_until_due:
              type: integer
            due_state:
              type: string
              enum: [scheduled, due_soon, overdue, paused, cancelled, unknown]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Notification:
      type: object
      required: [id, user_id, type, title, body, created_at, updated_at]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
        title:
          type: string
        body:
          type: string
        action_url:
          type: string
        read_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [notifications, unread_count, page, page_size, total, total_pages]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    SplitFriendInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    SplitFriend:
      type: object
