        next_due_date:
          type: string
          format: date
        last_charged_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, paused, cancelled]
          default: active
        reminder_days:
          type: integer
          minimum: 0
          maximum: 30
          default: 3
        notes:
          type: string
