          type: [integer, "null"]
          minimum: 1
        name:
          type: string
          maxLength: 120
        merchant:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 80
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
