          type: string
    SplitSettlement:
      allOf:
        - $ref: "#/components/schemas/SplitSettlementInput"
        - type: object
          required: [id, user_id, created_at, updated_at]
          properties:
            id:
              type: integer
            user_id:
              type: integer
            friend:
              $ref: "#/components/schemas/SplitFriend"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SplitBalance:
      type: object
      required: [friend, total_owed_by_friend, total_owed_to_friend, net_balance]
      properties:
        friend:
          $ref: "#/components/schemas/SplitFriend"
        total_owed_by_friend:
          type: number
          multipleOf: 0.01
        total_owed_to_friend:
          type: number
          multipleOf: 0.01
        net_balance:
          type: number
          multipleOf: 0.01
    EMICalculationInput:
      type: object
      required: [principal_amount, annual_interest_rate_percent, tenure_months]
      properties:
        principal_amount:
          type: number
          multipleOf: 0.01
          exclusiveMinimum: 0
        annual_interest_rate_percent:
          type: number
          minimum: 0
          maximum: 100
        tenure_months:
          type: integer
          minimum: 1
          maximum: 360
        currency:
          type: string
          enum: [INR]
          default: INR
    EMICalculation:
      type: object
      required: [principal_amount, currency, annual_interest_rate_percent, tenure_months, monthly_emi, total_payment, total_interest, schedule]
      properties:
        principal_amount:
          type: number
          multipleOf: 0.01
        currency:
          type: string
          enum: [INR]
        annual_interest_rate_percent:
          type: number
        tenure_months:
          type: integer
        monthly_emi:
          type: number
          multipleOf: 0.01
        total_payment:
          type: number
          multipleOf: 0.01
        total_interest:
          type: number
          multipleOf: 0.01
        schedule:
          type: array
          maxItems: 360
          items:
            $ref: "#/components/schemas/EMIScheduleMonth"
    EMIScheduleMonth:
      type: object
      required: [month, opening_balance, payment_amount, principal_amount, interest_amount, closing_balance]
      properties:
        month:
          type: integer
        opening_balance:
          type: number
          multipleOf: 0.01
        payment_amount:
          type: number
          multipleOf: 0.01
        principal_amount:
          type: number
          multipleOf: 0.01
        interest_amount:
          type: number
          multipleOf: 0.01
        closing_balance:
          type: number
          multipleOf: 0.01
    ValidationError:
      type: object
      required: [error, fields]
      properties:
        error:
          const: invalid_entry
        fields:
          type: object
          additionalProperties:
            type: string
    DeleteUserResponse:
      type: object
      required: [message]
      properties:
        message:
          const: account deleted
security:
  - bearerAuth: []
