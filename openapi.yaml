
openapi: 3.1.0
info:
  title: FINNRI MVP API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/parse:
    post:
      summary: Parse audio/text to structured expense/income JSON
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                hint_text:
                  type: string
                tz:
                  type: string
                  default: Asia/Kolkata
      responses:
        "200":
          description: Parsed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseOrIncomeEntry"
        "422":
          description: Could not parse
  /v1/entries:
    post:
      summary: Create a transaction entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "400":
          description: Invalid payload
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Database error
    get:
      summary: List all transaction entries
      parameters:
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedEntry"
        "500":
          description: Database error
  /v1/accounts:
    get:
      summary: List accounts owned by the authenticated user
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Create an account/payment source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /v1/entries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get an owned transaction
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "404":
          description: Not found
    put:
      summary: Update an owned transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalEntry"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    delete:
      summary: Delete an owned transaction
      responses:
        "204":
          description: Deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ExpenseOrIncomeEntry:
      $ref: ./schemas/expense_entry.schema.json
    FinalEntry:
      $ref: ./schemas/final_entry.schema.json
    SavedEntry:
      allOf:
        - $ref: "#/components/schemas/FinalEntry"
        - type: object
          properties:
            id:
              type: integer
            account:
              $ref: "#/components/schemas/Account"
            source:
              type: string
              enum: [manual, text, voice]
            source_text:
              type: string
    AccountInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        provider:
          type: string
        identifier:
          type: string
        is_default:
          type: boolean
    Account:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        provider:
          type: string
        identifier:
          type: string
        is_default:
          type: boolean
    ValidationError:
      type: object
      required: [error, fields]
      properties:
        error:
          const: invalid_entry
        fields:
          type: object
          additionalProperties:
            type: string
security:
  - bearerAuth: []
