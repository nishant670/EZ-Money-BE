
openapi: 3.1.0
info:
  title: FINNRI MVP API
  version: 1.1.0
servers:
  - url: http://localhost:8080
paths:
  /v1/dashboard:
    get:
      summary: Return the deterministic spending dashboard for a date range
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: tz
          schema:
            type: string
            default: Asia/Kolkata
      responses:
        "200":
          description: Dashboard calculated from owned transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "422":
          description: Invalid or oversized date range
  /v1/insights:
    get:
      deprecated: true
      summary: Compatibility alias for GET /v1/dashboard
      responses:
        "200":
          description: Dashboard calculated from owned transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /v1/user:
    delete:
      summary: Permanently delete the authenticated user and owned data
      responses:
        "200":
          description: User and owned data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "401":
          description: Missing or invalid session
        "404":
          description: User not found
        "500":
          description: Delete failed
  /v1/parse:
    post:
      summary: Parse audio/text to structured expense/income JSON
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                hint_text:
                  type: string
                tz:
                  type: string
                  default: Asia/Kolkata
      responses:
        "200":
          description: Parsed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseOrIncomeEntry"
        "422":
          description: Could not parse
  /v1/entries:
    post:
      summary: Create a transaction entry
      parameters:
        - in: header
          name: Idempotency-Key
          description: Reuse the same key when retrying one logical create request.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "400":
          description: Invalid payload
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Database error
    get:
      summary: List all transaction entries
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [expense, income]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [Cash, UPI, Credit Card, Wallets]
        - in: query
          name: q
          description: Case-insensitive search across title, merchant, and notes.
          schema:
            type: string
        - in: query
          name: tag
          description: Return only entries that include this tag.
          schema:
            type: string
        - in: query
          name: account_id
          description: Return only entries linked to this owned account.
          schema:
            type: integer
        - in: query
          name: min_amount
          schema:
            type: string
        - in: query
          name: max_amount
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
        "422":
          description: Invalid filters
        "500":
          description: Database error
  /v1/accounts:
    get:
      summary: List accounts owned by the authenticated user
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Create an account/payment source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
  /v1/accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned account or make it the default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "422":
          description: Invalid account fields
        "404":
          description: Account not found
    delete:
      summary: Delete an unused owned account
      responses:
        "200":
          description: Deleted
        "409":
          description: Account is used by transactions or is the user's only account
        "404":
          description: Account not found
  /v1/entries/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Get an owned transaction
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "404":
          description: Not found
    put:
      summary: Update an owned transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntry"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedEntry"
        "422":
          description: Field validation or account ownership failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
    delete:
      summary: Delete an owned transaction
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /v1/notifications:
    get:
      summary: List notifications for the authenticated user
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, unread, read]
            default: all
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "422":
          description: Invalid filters
  /v1/notifications/unread-count:
    get:
      summary: Return the authenticated user's unread notification count
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
  /v1/notifications/read-all:
    patch:
      summary: Mark all notifications read for the authenticated user
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
  /v1/notifications/{id}/read:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    patch:
      summary: Mark one owned notification read
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
  /v1/notifications/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    delete:
      summary: Delete one owned notification
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found
  /v1/budgets:
    get:
      summary: List monthly budgets owned by the authenticated user
      responses:
        "200":
          description: Budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Budget"
    post:
      summary: Create a monthly INR budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "201":
          description: Budget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "422":
          description: Invalid budget fields
  /v1/budgets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned monthly budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetInput"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "404":
          description: Budget not found
        "422":
          description: Invalid budget fields
    delete:
      summary: Delete an owned budget and its alert state
      responses:
        "200":
          description: Deleted
        "404":
          description: Budget not found
  /v1/subscriptions:
    get:
      summary: List subscriptions owned by the authenticated user
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, active, paused, cancelled]
            default: all
      responses:
        "200":
          description: Subscriptions with due-state metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        "422":
          description: Invalid filters
    post:
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "422":
          description: Invalid subscription fields or account ownership
  /v1/subscriptions/reminders:
    post:
      summary: Create deduplicated due/overdue subscription reminders
      responses:
        "200":
          description: Reminder count
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created:
                    type: integer
  /v1/subscriptions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update an owned subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: Subscription not found
        "422":
          description: Invalid subscription fields or account ownership
    delete:
      summary: Delete an owned subscription and reminder state
      responses:
        "200":
          description: Deleted
        "404":
          description: Subscription not found
  /v1/subscriptions/{id}/mark-paid:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    post:
      summary: Mark a subscription paid and advance its next due date
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_date:
                  type: string
                  format: date
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "404":
          description: Subscription not found
        "422":
          description: Invalid paid date
  /v1/split/friends:
    post:
      summary: Create a bill-splitting friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitFriendInput"
      responses:
        "201":
          description: Friend created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitFriend"
        "422":
          description: Invalid friend payload
    get:
      summary: List bill-splitting friends
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, all]
      responses:
        "200":
          description: Friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitFriend"
  /v1/split/friends/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update a bill-splitting friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitFriendInput"
      responses:
        "200":
          description: Friend updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitFriend"
        "404":
          description: Friend not found
    delete:
      summary: Archive a bill-splitting friend
      responses:
        "200":
          description: Friend archived
        "404":
          description: Friend not found
  /v1/split/groups:
    post:
      summary: Create a bill-splitting group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitGroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitGroup"
        "422":
          description: Invalid group payload
    get:
      summary: List bill-splitting groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitGroup"
  /v1/split/groups/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      summary: Update a bill-splitting group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitGroupInput"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitGroup"
        "404":
          description: Group not found
    delete:
      summary: Archive a bill-splitting group
      responses:
        "200":
          description: Group archived
        "404":
          description: Group not found
  /v1/split/bills:
    post:
      summary: Create a split bill with friend shares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitBillInput"
      responses:
        "201":
          description: Split bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitBill"
        "422":
          description: Invalid bill payload or friend ownership
    get:
      summary: List split bills
      responses:
        "200":
          description: Split bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitBill"
  /v1/split/bills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Update a split bill with friend shares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitBillInput"
      responses:
        "200":
          description: Split bill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitBill"
        "404":
          description: Split bill not found
        "422":
          description: Invalid bill payload or ownership
    delete:
      summary: Delete a split bill
      responses:
        "200":
          description: Split bill deleted
        "404":
          description: Split bill not found
  /v1/split/settlements:
    post:
      summary: Record a split settlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitSettlementInput"
      responses:
        "201":
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitSettlement"
        "422":
          description: Invalid settlement payload or friend ownership
    get:
      summary: List split settlements
      responses:
        "200":
          description: Split settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitSettlement"
  /v1/split/balances:
    get:
      summary: Return friend balances after bills and settlements
      responses:
        "200":
          description: Friend balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitBalance"
  /v1/tools/emi/calculate:
    post:
      summary: Calculate EMI summary and amortization schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EMICalculationInput"
      responses:
        "200":
          description: EMI calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EMICalculation"
        "422":
          description: Invalid EMI fields
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Dashboard:
      type: object
      required: [period, summary, top_categories, top_merchants, account_spending, recent_transactions, insights, recurring_candidates]
      properties:
        period:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        summary:
          type: object
          required: [total_spent, total_income, daily_average, transaction_count]
          properties:
            total_spent:
              type: number
            total_income:
              type: number
            daily_average:
              type: number
            transaction_count:
              type: integer
        top_categories:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCategory"
        top_merchants:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMerchant"
        account_spending:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAccount"
        recent_transactions:
          type: array
          items:
            $ref: "#/components/schemas/SavedEntry"
        insights:
          type: array
          items:
            $ref: "#/components/schemas/InsightCard"
        recurring_candidates:
          type: array
          items:
            $ref: "#/components/schemas/DashboardRecurringCandidate"
    DashboardCategory:
      type: object
      required: [category, amount, percentage, change]
      properties:
        category:
          type: string
        amount:
          type: number
        percentage:
          type: number
        change:
          type: number
    DashboardMerchant:
      type: object
      required: [merchant, amount, transaction_count]
      properties:
        merchant:
          type: string
        amount:
          type: number
        transaction_count:
          type: integer
    DashboardAccount:
      type: object
      required: [account_name, amount, percentage]
      properties:
        account_id:
          type: [integer, "null"]
        account_name:
          type: string
        amount:
          type: number
        percentage:
          type: number
    DashboardRecurringCandidate:
      type: object
      required: [label, merchant, category, average_amount, interval_guess, confidence, occurrences, last_seen_date, next_expected_date, review_due]
      properties:
        label:
          type: string
        merchant:
          type: string
        category:
          type: string
        average_amount:
          type: number
        interval_guess:
          type: string
          enum: [weekly, monthly]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        occurrences:
          type: integer
        last_seen_date:
          type: string
          format: date
        next_expected_date:
          type: string
          format: date
        review_due:
          type: boolean
    InsightCard:
      type: object
      required: [kind, severity, title, body]
      properties:
        kind:
          type: string
          enum: [period_comparison, category_increase, top_merchant, account_usage, unusual_spending, recurring_candidate]
        severity:
          type: string
          enum: [info, warning, success]
        title:
          type: string
        body:
          type: string
    ExpenseOrIncomeEntry:
      $ref: ./schemas/expense_entry.schema.json
    FinalEntry:
      $ref: ./schemas/final_entry.schema.json
    UpdateEntry:
      type: object
      additionalProperties: false
      required: [account_id]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [expense, income]
        amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: INR
        source:
          type: string
          enum: [manual, text, voice]
        account_id:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [Cash, UPI, Credit Card, Wallets]
        category:
          type: string
        merchant:
          type: string
        notes:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        tag:
          type: string
    SavedEntry:
      allOf:
        - $ref: "#/components/schemas/FinalEntry"
        - type: object
          properties:
            id:
              type: integer
            account:
              $ref: "#/components/schemas/Account"
            source:
              type: string
              enum: [manual, text, voice]
            source_text:
              type: string
    EntryPage:
      type: object
      required: [entries, page, page_size, total, total_pages]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SavedEntry"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    AccountInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        provider:
          type: string
        identifier:
          type: string
        credit_limit:
          type: number
          multipleOf: 0.01
          minimum: 0
        due_day:
          type: integer
          minimum: 0
          maximum: 31
        fee_month:
          type: string
        balance:
          type: number
          multipleOf: 0.01
        is_default:
          type: boolean
    Account:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [cash, upi, bank, credit_card, debit_card, wallet, other]
        provider:
          type: string
        identifier:
          type: string
        credit_limit:
          type: number
          multipleOf: 0.01
        due_day:
          type: integer
        fee_month:
          type: string
        balance:
          type: number
          multipleOf: 0.01
        is_default:
          type: boolean
    BudgetInput:
      type: object
      required: [name, limit_amount]
      properties:
        name:
          type: string
          maxLength: 120
        period:
          type: string
          enum: [monthly]
          default: monthly
        category:
          type: string
          description: Empty means all expense categories.
          maxLength: 80
        limit_amount:
          oneOf:
            - type: number
              exclusiveMinimum: 0
              multipleOf: 0.01
            - type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        currency:
          type: string
